<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Trip Mapper</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app-shell">
    <nav class="navbar" aria-label="Trip categories">
      <a class="navbar-brand" href="#">Trip Mapper</a>
      <ul class="navbar-tabs" role="tablist">
        <li role="presentation">
          <button type="button" class="navbar-tab is-active" role="tab" aria-selected="true" data-category="home">Home</button>
        </li>
        <li role="presentation">
          <button type="button" class="navbar-tab" role="tab" aria-selected="false" data-category="flights">Flights</button>
        </li>
        <li role="presentation">
          <button type="button" class="navbar-tab" role="tab" aria-selected="false" data-category="stays">Stays</button>
        </li>
        <li role="presentation">
          <button type="button" class="navbar-tab" role="tab" aria-selected="false" data-category="attractions">Attractions</button>
        </li>
      </ul>
    </nav>

    <div class="app">
    <aside class="left-sidebar">
      <header class="left-sidebar-header">
        <h1 id="left-sidebar-title">Your trip</h1>
        <p id="left-sidebar-subtitle">Add stops to your trip on the map.</p>
      </header>

      <form class="left-sidebar-form" id="stop-form" autocomplete="off" novalidate>
        <div class="field field--location" id="location-field">
          <label for="location">Location</label>
          <input
            type="text"
            id="location"
            name="location"
            placeholder="e.g. Eiffel Tower, Paris"
          />
          <p class="field-error" id="location-error" role="alert"></p>
        </div>

        <div class="field">
          <label for="comments">Comments</label>
          <textarea
            id="comments"
            name="comments"
            rows="3"
            placeholder="Notes, times, booking refs…"
          ></textarea>
        </div>

        <div class="field">
          <label for="color">Color</label>
          <div class="color-row">
            <input type="color" id="color" name="color" value="#3b82f6" />
            <input
              type="text"
              id="color-hex"
              value="#3b82f6"
              maxlength="7"
              aria-label="Color hex value"
            />
          </div>
        </div>

        <p class="form-toast" id="form-toast" aria-live="polite"></p>
        <div class="form-actions">
          <button type="button" class="btn-cancel" id="cancel-edit" hidden>Cancel</button>
          <button type="submit" class="btn-add" id="submit-stop">Add to map</button>
        </div>
      </form>

      <section class="stops-section" aria-label="Trip stops">
        <h2>Your stops</h2>
        <p class="stops-empty" id="stops-empty">No stops yet. Add a location above.</p>
        <ul class="stops-list" id="stops-list"></ul>
      </section>
    </aside>

    <main class="map-container">
      <div id="map"></div>
    </main>

    <aside class="right-sidebar">
      <header class="right-sidebar-header">
        <h1 id="right-sidebar-title">About this Place</h1>
        <p id="right-sidebar-subtitle">Click on a pin to learn more about it.</p>
      </header>

      <div class="ai-info-section" style="padding: 1.25rem; display: flex; flex-direction: column; gap: 0.5rem; overflow-y: auto; flex: 1;">
        <div id="ai-status" style="font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.04em; color: var(--text-muted);">AI Engine: Initializing...</div>
        <div id="ai-output" style="font-size: 0.9375rem; line-height: 1.5; color: var(--text); white-space: pre-wrap;">The local background model is preparing (~350MB)...</div>
      </div>
    </aside>
    </div>
  </div>

  <script type="module" src="app.js"></script>

  <script type="module">
    import { pipeline } from 'https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.1';

    let generator;
    const statusDiv = document.getElementById('ai-status');
    const outputDiv = document.getElementById('ai-output');

    async function initAI() {
        try {
            statusDiv.innerText = "AI Engine: Downloading Model (~350MB)...";
            generator = await pipeline('text-generation', 'Xenova/Qwen1.5-0.5B-Chat');
            statusDiv.innerText = "AI Engine: Standby / Ready";
            outputDiv.innerText = "Select or click any stop to view automated AI facts.";
        } catch (error) {
            statusDiv.innerText = "AI Engine: Offline";
            outputDiv.innerText = "Error loading AI: " + error.message;
        }
    }

    window.askAIAboutPlace = async function(locationName) {
        if (!generator) return;
        statusDiv.innerText = "AI Engine: Generating Fact...";
        outputDiv.innerText = `Thinking about ${locationName}...`;
        try {
            const cleanPrompt = `Give me a concise, one-sentence interesting travel fact about ${locationName}.`;
            const response = await generator(cleanPrompt, {
                max_new_tokens: 80,
                temperature: 0.6,
                do_sample: true
            });
            let generatedText = response[0].generated_text;
            if (generatedText.startsWith(cleanPrompt)) {
                generatedText = generatedText.substring(cleanPrompt.length).trim();
            }
            statusDiv.innerText = "AI Engine: Done";
            outputDiv.innerText = generatedText || "No information found.";
        } catch (error) {
            statusDiv.innerText = "AI Engine: Error";
            outputDiv.innerText = "Could not produce data: " + error.message;
        }
    }
    initAI();
  </script>
</body>
</html>
